name: DEV Build, Deploy and Sync to AWS

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build everything
        run: npm run build
        env:
          STAGE: dev
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_LAT: ${{ secrets.VITE_LAT }}
          VITE_LON: ${{ secrets.VITE_LON }}
          VITE_TIMEZONE: ${{ secrets.VITE_TIMEZONE }}
          VITE_X_API_KEY: ${{ secrets.VITE_X_API_KEY }}
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          SOLARMAN_TOKEN: ${{ secrets.SOLARMAN_TOKEN }}
          DEVICE_SN: ${{ secrets.DEVICE_SN }}
          ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN }}
          BYPASS_PASSWORD: ${{ secrets.BYPASS_PASSWORD }}

      - name: Deploy backend stack
        run: npm run deploy:dev
        env:
          STAGE: dev
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          SOLARMAN_TOKEN: ${{ secrets.SOLARMAN_TOKEN }}
          DEVICE_SN: ${{ secrets.DEVICE_SN }}
          ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN }}
          BYPASS_PASSWORD: ${{ secrets.BYPASS_PASSWORD }}

      - name: Sync static files to S3
        run: aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} --delete

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
